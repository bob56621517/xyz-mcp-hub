# 测试专用覆盖：公共 Proxy 端点的上游指向不可达本地地址，使既有测试启动时快失败跳过
# （ADR-0005 优雅降级），避免每次测试启动都尝试连接生产 MCP Server。
# 专项测试 McpPublicProxyEndpointTest 经 DynamicPropertySource 覆盖为内嵌上游。
# 注意：每新增一个免认证 public proxy provider，必须在此登记其 upstream-url，
# 否则所有其它 @SpringBootTest 上下文会尝试直连生产 MCP Server。
proxy.context7.upstream-url=http://localhost:1/mcp
proxy.grep-app.upstream-url=http://localhost:1/mcp
proxy.wikidata.upstream-url=http://localhost:1/mcp
# markitdown 默认不启用：避免每个 @SpringBootTest 上下文启动时拉起 markitdown 子进程。
# 专项 markitdown 集成测试经 @TestPropertySource / 手工冒烟（MarkitdownSmoke）显式开启。
content.markitdown.enabled=false
