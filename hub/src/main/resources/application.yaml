spring:
  application:
    name: xyz-mcp-hub
  profiles:
    active: local
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.McpServerAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.McpServerStatelessAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.annotations.McpServerAnnotationScannerAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.annotations.McpServerSpecificationFactoryAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.annotations.StatelessServerSpecificationFactoryAutoConfiguration
      - org.springframework.ai.mcp.server.webmvc.autoconfigure.McpServerStreamableHttpWebMvcAutoConfiguration
      - org.springframework.ai.mcp.server.webmvc.autoconfigure.McpServerSseWebMvcAutoConfiguration
      - org.springframework.ai.mcp.server.webmvc.autoconfigure.McpServerStatelessWebMvcAutoConfiguration
server:
  tomcat:
    # URL 参数工具视图（ADR-0011）用 [a,b] 方括号列表语法，Tomcat 需放行方括号字符，
    # 否则连接 /xyz-hub/mcp?includes=[bocha] 会被 400 拒掉。
    relaxed-query-chars:
      - "["
      - "]"

vaadin:
  launch-browser: false
  url-mapping: /ui/*

bocha:
  base-url: https://api.bochaai.com
  # 敏感值由环境变量或 application-local.yml 注入（见 ADR-0005）；缺省为空，服务不注册
  api-key: ${BOCHA_API_KEY:}

github:
  # GitHub 官方远程托管 MCP 服务端点（Streamable HTTP，见 ADR-0007）
  upstream-url: https://api.githubcopilot.com/mcp/
  # 敏感值由环境变量或 application-local.yml 注入（见 ADR-0005）；缺省为空，github-full / github-readonly 不注册
  token: ${GITHUB_TOKEN:}

playwright:
  # 共享 chromium 进程 + 会话租约（见 ADR-0009）。headless 是否无头启动；
  # navigation-timeout-seconds 单次导航超时（秒）；session.ttl-seconds 会话无操作自动回收（秒，默认 300）；
  # session.max 并发会话上限（默认 8）；session.scan-interval-seconds 后台回收扫描周期（秒，默认 60）
  headless: true
  navigation-timeout-seconds: 30
  session:
    ttl-seconds: 300
    max: 8
    scan-interval-seconds: 60

docker:
  # docker 顶级模块（ADR-0012 #32）：ContainerManager 容器生命周期管理（首用拉起/健康检查/闲置回收/关闭销毁）。
  # manifest-path 指向 mvn 生成的 manifests/mcp-images.yaml（容器运行规范 image/protocol/port/hostPort，
  # 缺失视为无容器规格、不抛）；ttl-seconds 容器闲置自动回收（秒，默认 600）；scan-interval-seconds 后台
  # 回收扫描周期（秒，默认 60）；start-timeout-seconds 健康检查等待上限（秒，默认 60）；pull-timeout-seconds
  # 镜像拉取超时（秒，默认 300）。enabled=false 时不创建容器管理 bean。
  enabled: true
  manifest-path: manifests/mcp-images.yaml
  ttl-seconds: 600
  scan-interval-seconds: 60
  start-timeout-seconds: 60
  pull-timeout-seconds: 300

# 旧配置驱动的组合端点 Space（ADR-0008）已整体移除（issue #39），被组合源 specs 取代。
# 组合源 specs（ADR-0011 / issue #33）：mcp.specs 定义一个派生源，发布进目录（type: composite，
# 带 base 溯源），被 includes/excludes 引用时与普通源等效。项与 URL 参数同一套下划线平坦名
# 语法——源名（bocha → 该源全部工具）、工具名（bocha_web_search → 精确一个）或组合源名（嵌套）；
# 启动时静态解析，循环定义被拒 fail-fast。默认不声明任何组合源。
#   mcp:
#     specs:
#       github-readonly:
#         includes: [github]
#         excludes: [github_create_issue]
#       docs:                       # 嵌套：引用上方的组合源 + 普通源
#         includes: [github-readonly, utils]
# 未知的 includes/excludes 项静默忽略 + warn（不使连接失败）；组合源名与已注册源冲突会启动失败。
