# 测试专用覆盖：#52 起 proxy 源由 mcp.proxies 配置驱动（application.yaml 定义默认条目）。
# 这里把 mcp.proxies 置空——默认测试上下文不注册任何 proxy 源，避免每次测试启动都尝试连接生产
# MCP Server。需要 proxy 源的专项测试（McpProxySingleEndpointTest / McpGithubEndpointTest /
# McpProxyDegradationTest / McpCatalogEndpointTest）经 @DynamicPropertySource 提供完整
# mcp.proxies 列表（显式 name/upstream-url，不依赖 yaml 结构列表的索引合并——Spring 7 下扁平
# 索引属性与 YAML 结构列表无法按索引合并，测试统一用完整索引覆盖）。
mcp.proxies=
# jina 为 native 源（ADR-0016）：默认置空 jina.url → 源未启用（目录列出 enabled=false、工具为空），
# 避免默认测试上下文注册 jina_reader 工具；专项测试（McpCatalogEndpointTest）经 @DynamicPropertySource
# 提供完整配置。
jina.url=
